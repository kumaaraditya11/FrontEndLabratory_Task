<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            background-color: lightgray;
            text-align: center;
            font-family: Arial;
        }

        .box {
            background-color: #303b50;
            width: 300px;
            padding: 15px;
            margin: auto;
            margin-top: 50px;
            border-radius: 15px;
        }

        input {
            width: 90%;
            height: 50px;
            font-size: 25px;
            margin-bottom: 10px;
            text-align: right;
        }

        button {
            width: 65px;
            height: 50px;
            margin: 3px;
            font-size: 18px;
        }

        .clear {
            width: 140px;
            background-color: lightcoral;
        }

        .operator {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="box">

        <input type="text" readonly>

        <br>

        <button class="clear">CLEAR</button>
        <button class="clear">DELETE</button>

        <br>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">/</button>

        <br>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">*</button>

        <br>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">-</button>

        <br>

        <button>.</button>
        <button>0</button>
        <button>=</button>
        <button class="operator">+</button>

    </div>

</body>
</html>
