<html>
<head>
    <title>DOM Manipulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 60%;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #eee;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .delete {
            background-color: red;
        }

        .main-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .thumbnails img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .thumbnails img:hover {
            border: 3px solid #007bff;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>To-Do List</h2>

        <input type="text" id="taskInput" placeholder="Enter your task">

        <button id="addBtn">Add Task</button>

        <ul id="taskList"></ul>

    </div>


    <div class="container">

        <h2>Image Gallery</h2>

        <img id="mainImage"
        class="main-image"
        src="https://picsum.photos/id/1015/900/500">

        <div class="thumbnails">

            <img src="https://picsum.photos/id/1015/900/500">

            <img src="https://picsum.photos/id/1016/900/500">

            <img src="https://picsum.photos/id/1025/900/500">

            <img src="https://picsum.photos/id/1039/900/500">

        </div>

    </div>


    <script>

        let addBtn = document.getElementById("addBtn");

        let taskInput = document.getElementById("taskInput");

        let taskList = document.getElementById("taskList");


        addBtn.addEventListener("click", function() {

            let task = taskInput.value.trim();

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.textContent = task;

            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Remove";

            deleteBtn.className = "delete";

            deleteBtn.addEventListener("click", function() {

                li.remove();

            });

            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            taskInput.value = "";

        });


        let thumbnails = document.querySelectorAll(".thumbnails img");

        let mainImage = document.getElementById("mainImage");


        thumbnails.forEach(function(image) {

            image.addEventListener("click", function() {

                mainImage.src = image.src;

            });

        });

    </script>

</body>
</html>
