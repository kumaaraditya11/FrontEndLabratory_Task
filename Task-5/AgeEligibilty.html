<!DOCTYPE html>
<html>
<head>
    <title>Age Eligibility Check</title>
</head>
<body>
    <script>
        let age = prompt("Enter your age:");

        age = Number(age);

        if (Number.isFinite(age) && Number.isInteger(age) && age >= 0) {
            let result = age >= 18 ? "You are eligible." : "You are not eligible.";
            alert(result);
            document.write("Your age is " + age + "<br>" + result);
        } else {
            alert("Please enter a valid integer age.");
            document.write("Invalid age entered.");
        }
    </script>
</body>
</html>
